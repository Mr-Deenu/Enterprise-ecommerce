services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: deenu
      MYSQL_DATABASE: ecommerce_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "8000:8000"

    environment:
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USER: root
      DB_PASSWORD: "your_mysql_root_password"

    depends_on:
      - mysql

volumes:
  mysql_data: